apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-litellm-postgres-config
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-litellm-postgres-config
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: my-cisc4900-config
      property: litellm_username
  - secretKey: password
    remoteRef:
      key: my-cisc4900-config
      property: litellm_password
  - secretKey: database-url
    remoteRef:
      key: my-cisc4900-config
      property: litellm_database_url
  - secretKey: master-key
    remoteRef:
      key: my-cisc4900-config
      property: litellm_master_key
