apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-np
  namespace: litellm
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: open-webui
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: llamacpp-rocm
      ports:
        - protocol: TCP
          port: 8080
    - to:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: litellm-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-postgres-np
  namespace: litellm
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: litellm-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: litellm
      - podSelector:
          matchLabels:
            cnpg.io/cluster: litellm-postgres
      ports:
        - protocol: TCP
          port: 5432
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cnpg-system
      - podSelector:
          matchLabels:
            cnpg.io/cluster: litellm-postgres
      ports:
        - protocol: TCP
          port: 8000
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 9187