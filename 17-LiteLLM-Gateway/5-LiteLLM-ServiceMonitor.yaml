apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-monitor
  namespace: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  namespaceSelector:
    matchNames:
      - litellm
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
