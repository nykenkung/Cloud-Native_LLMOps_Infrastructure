apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llamacpp-rocm-monitor
  namespace: llamacpp-rocm
spec:
  selector:
    matchLabels:
      app: llamacpp-rocm
  namespaceSelector:
    matchNames:
      - llamacpp-rocm
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
