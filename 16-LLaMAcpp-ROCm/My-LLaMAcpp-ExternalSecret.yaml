apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llamacpp-api-key
  namespace: llamacpp-rocm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: llamacpp-api-key
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: my-cisc4900-config
      property: llamacpp_api_key
