apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-qdrant-config
  namespace: qdrant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-qdrant-config
    creationPolicy: Owner
  data:
  - secretKey: MY-QDRANT-KEY
    remoteRef:
      key: my-cisc4900-config
      property: qdrant_key
  - secretKey: MY-QDRANT-READ-ONLY-KEY
    remoteRef:
      key: my-cisc4900-config
      property: qdrant_read_only_key
