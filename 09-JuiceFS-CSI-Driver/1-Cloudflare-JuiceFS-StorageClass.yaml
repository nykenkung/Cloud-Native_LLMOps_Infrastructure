apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudflare-juicefs-sc
provisioner: csi.juicefs.com
parameters:
  csi.storage.k8s.io/node-publish-secret-name: my-cloudflare-juicefs-config
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
  csi.storage.k8s.io/provisioner-secret-name: my-cloudflare-juicefs-config
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  juicefs/mount-options: cache-dir=/tmp/juicefs-cache,cache-size=10240,free-space-ratio=0.1,prefetch=1