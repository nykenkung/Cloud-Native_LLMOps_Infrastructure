apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-cloudflare-juicefs-config
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-cloudflare-juicefs-config
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_username
  - secretKey: password
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_password
  - secretKey: name
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_name
  - secretKey: metaurl
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_metaurl
  - secretKey: storage
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_storage
  - secretKey: bucket
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_bucket
  - secretKey: access-key
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_access_key
  - secretKey: secret-key
    remoteRef:
      key: my-cisc4900-config
      property: juicefs_secret_key
