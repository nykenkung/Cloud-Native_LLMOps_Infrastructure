apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: grafana
spec:
  ingressClassName: nginx
  rules:
  - host: grafana.kung.nyc
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lgtm-prometheus-grafana
            port:
              number: 80
  - host: grafana.192.168.1.3.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lgtm-prometheus-grafana
            port:
              number: 80