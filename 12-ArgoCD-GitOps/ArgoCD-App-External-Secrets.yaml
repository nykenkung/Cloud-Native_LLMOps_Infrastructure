apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      values: |-
        installCRDs: true

        extraVolumes:
          - name: gcp-wif-config
            secret:
              secretName: gcp-wif-config
          - name: k8s-oidc-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                    audience: "//iam.googleapis.com/projects/449506712476/locations/global/workloadIdentityPools/cisc4900-k8s-workload/providers/github-oidc-provider"

        extraVolumeMounts:
          - name: gcp-wif-config
            mountPath: /var/run/secrets/gcp-wif
            readOnly: true
          - name: k8s-oidc-token
            mountPath: /var/run/secrets/k8s-oidc
            readOnly: true

        extraEnv:
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: "/var/run/secrets/gcp-wif/config"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true