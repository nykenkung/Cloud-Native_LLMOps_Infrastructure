apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-np
  namespace: open-webui
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: open-webui-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-postgres-np
  namespace: open-webui
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: open-webui-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: open-webui
      - podSelector:
          matchLabels:
            cnpg.io/cluster: open-webui-postgres
      ports:
        - protocol: TCP
          port: 5432
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cnpg-system
      - podSelector:
          matchLabels:
            cnpg.io/cluster: open-webui-postgres
      ports:
        - protocol: TCP
          port: 8000
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 9187