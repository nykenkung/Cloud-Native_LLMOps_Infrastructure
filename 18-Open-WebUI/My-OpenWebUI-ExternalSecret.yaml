apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-open-webui-secret
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-open-webui-secret
    creationPolicy: Owner
  data:
  - secretKey: OPENAI_API_KEYS
    remoteRef:
      key: my-cisc4900-config
      property: openwebui_openai_api_keys
  - secretKey: WEBUI_SECRET_KEY
    remoteRef:
      key: my-cisc4900-config
      property: openwebui_secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-open-webui-postgres-config
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-open-webui-postgres-config
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: my-cisc4900-config
      property: openwebui_db_username
  - secretKey: password
    remoteRef:
      key: my-cisc4900-config
      property: openwebui_db_password
  - secretKey: DATABASE_URL
    remoteRef:
      key: my-cisc4900-config
      property: openwebui_db_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
