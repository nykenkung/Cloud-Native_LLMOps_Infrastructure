apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-cloudflare-config
  namespace: external-secrets
  labels:
    external-secrets.io/type: webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: my-cloudflare-config
    creationPolicy: Owner
  data:
  - secretKey: MY_ACCOUNT_ID
    remoteRef:
      key: my-cisc4900-config
      property: cf_account_id
  - secretKey: MY_KV_NAMESPACE_ID
    remoteRef:
      key: my-cisc4900-config
      property: cf_kv_namespace_id
  - secretKey: MY_API_TOKEN
    remoteRef:
      key: my-cisc4900-config
      property: cf_api_token
