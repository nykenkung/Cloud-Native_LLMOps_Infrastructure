apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel-deploy
  namespace: cloudflare-kv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-tunnel-pod
  template:
    metadata:
      labels:
        app: cloudflared-tunnel-pod
    spec:
      containers:
      - name: cloudflared-tunnel-container
        image: cloudflare/cloudflared:latest
        args:
        - --metrics=0.0.0.0:2000
        - --no-autoupdate
        - --protocol=http2
        - tunnel
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-kv-secret
              key: CLOUDFLARE_TUNNEL_ID
        ports:
        - containerPort: 2000
          name: metrics
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3