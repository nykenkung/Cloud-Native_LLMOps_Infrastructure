apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-falcosidekick-ui-secret
  namespace: falco
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: falco-falcosidekick-ui-secret
    creationPolicy: Owner
    template:
      data:
        FALCOSIDEKICK_UI_USER: "{{ .username }}:{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: my-cisc4900-config
      property: litellm_username
  - secretKey: password
    remoteRef:
      key: my-cisc4900-config
      property: litellm_password
