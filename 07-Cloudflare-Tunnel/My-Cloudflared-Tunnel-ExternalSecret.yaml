apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-kv-secret
  namespace: cloudflare-kv
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: cloudflare-kv-secret
    creationPolicy: Owner
  data:
  - secretKey: CLOUDFLARE_TUNNEL_ID
    remoteRef:
      key: my-cisc4900-config
      property: cf_tunnel_id
